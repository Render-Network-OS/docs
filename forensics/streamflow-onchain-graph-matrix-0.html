<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}canvas{display:block;width:1280px;height:720px;image-rendering:pixelated}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>const CHUNK=0,RPC='https://public.rpc.solanavibestation.com/historical',TARGETS=[['BSkf','BSkf98N8ppTciokTv56AFA8f6HU4Kux7Ee9DV63mUinQ'],['HHXg','HHXgYtezE32aATgWQFn3knAsy2xhQsjfepps3MLe3MXN']],KNOWN='2YF4uZd8FhgHCjknRB2ESr6sTkEzUiooem5Phne85DHZhZKaCsQ14rLCmEHzhnFH2o58wWFM5YAPpPZ5VP5QgPLU';function post(body){const x=new XMLHttpRequest();x.open('POST',RPC,false);x.setRequestHeader('content-type','application/json');x.send(JSON.stringify(body));if(x.status!==200)throw Error('HTTP '+x.status+' '+x.responseText.slice(0,300));const j=JSON.parse(x.responseText);return j}function rpc(m,p){const j=post({jsonrpc:'2.0',id:1,method:m,params:p});if(j.error)throw Error(m+' '+JSON.stringify(j.error));return j.result}function tx(sig){try{return rpc('getTransaction',[sig,{encoding:'jsonParsed',commitment:'finalized',maxSupportedTransactionVersion:0}])}catch(e){return {__error:String(e)}}}function ix(x){if(x.parsed)return {p:x.program,id:x.programId,t:x.parsed.type,i:x.parsed.info};return {id:x.programId,a:x.accounts,d:x.data}}function sumTx(sig,t){if(!t||t.__error)return {s:sig,e:t?.__error||'null'};const m=t.transaction.message,keys=(m.accountKeys||[]).map(k=>typeof k==='string'?{p:k}:{p:k.pubkey,s:!!k.signer,w:!!k.writable}),lam=[];for(let i=0;i<keys.length;i++){const d=(t.meta.postBalances?.[i]||0)-(t.meta.preBalances?.[i]||0);if(d)lam.push({i,p:keys[i].p,d})}const tb={};for(const b of t.meta.preTokenBalances||[]){const k=b.accountIndex+'|'+b.mint+'|'+(b.owner||'');tb[k]={i:b.accountIndex,m:b.mint,o:b.owner||'',pre:b.uiTokenAmount.amount,post:'0'}}for(const b of t.meta.postTokenBalances||[]){const k=b.accountIndex+'|'+b.mint+'|'+(b.owner||'');(tb[k]??={i:b.accountIndex,m:b.mint,o:b.owner||'',pre:'0'}).post=b.uiTokenAmount.amount}const toks=Object.values(tb).map(b=>{try{b.d=(BigInt(b.post)-BigInt(b.pre)).toString()}catch{}return b}).filter(b=>b.d!=='0');return {s:sig,sl:t.slot,bt:t.blockTime,err:t.meta.err,fee:t.meta.fee,cu:t.meta.computeUnitsConsumed,k:keys,lam,tok:toks,ix:(m.instructions||[]).map(ix),in:(t.meta.innerInstructions||[]).map(g=>({n:g.index,x:g.instructions.map(ix)})),log:(t.meta.logMessages||[]).filter(z=>/Program log:|Program data:|failed/i.test(z))}}function account(a){let ai=null,tb=null,ta=null;try{ai=rpc('getAccountInfo',[a,{encoding:'base64',commitment:'finalized'}])}catch(e){ai={e:String(e)}}try{tb=rpc('getTokenAccountBalance',[a,{commitment:'finalized'}])}catch(e){tb={e:String(e)}}try{ta=rpc('getTokenAccountsByOwner',[a,{mint:'CQwwRomsuWsUCPYomZmRnwMns4ZCTASc31ExMvSysAF2'},{encoding:'jsonParsed',commitment:'finalized'}])}catch(e){ta={e:String(e)}}return {ai,tb,ta}}function collect(){const out={at:new Date().toISOString(),rpc:RPC,targets:{},known:null};for(const [n,a] of TARGETS){const sg=rpc('getSignaturesForAddress',[a,{limit:1000,commitment:'finalized'}]);out.targets[n]={a,account:account(a),sg,tx:sg.map(q=>sumTx(q.signature,tx(q.signature)))}}out.known=sumTx(KNOWN,tx(KNOWN));return out}function crc32(buf){let c=0xffffffff;for(const b of buf){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}async function gzip(b){const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();await w.write(b);await w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer())}function draw(chunk,total){const h=new Uint8Array(20);h.set(new TextEncoder().encode('RNDRGZ01'));const v=new DataView(h.buffer);v.setUint16(8,CHUNK);v.setUint16(10,total);v.setUint32(12,chunk.length);v.setUint32(16,crc32(chunk));const data=new Uint8Array(h.length+chunk.length);data.set(h);data.set(chunk,20);const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false}),x0=20,y0=20,cell=4,cols=300,rows=170;g.imageSmoothingEnabled=false;g.fillStyle='#ff00ff';g.fillRect(0,0,1280,720);g.fillStyle='#00ffff';g.fillRect(x0-4,y0-4,cols*cell+8,rows*cell+8);let n=0;for(const b of data)for(const q of[b>>4,b&15]){const x=n%cols,y=Math.floor(n/cols),z=q*16+8;g.fillStyle=`rgb(${z},${z},${z})`;g.fillRect(x0+x*cell,y0+y*cell,cell,cell);n++}for(;n<cols*rows;n++){const x=n%cols,y=Math.floor(n/cols);g.fillStyle='rgb(8,8,8)';g.fillRect(x0+x*cell,y0+y*cell,cell,cell)}}(async()=>{try{const raw=new TextEncoder().encode(JSON.stringify(collect())),z=await gzip(raw),cap=25480,total=Math.ceil(z.length/cap),part=z.slice(CHUNK*cap,(CHUNK+1)*cap);draw(part,total)}catch(e){const raw=new TextEncoder().encode(JSON.stringify({error:String(e.stack||e)})),z=await gzip(raw);draw(z,1)}})()</script></body></html>
