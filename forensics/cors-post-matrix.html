<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:12px;background:#071019;color:#e5edf5;font:11px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}h1{margin:0 0 9px;color:#7dd3fc;font:700 18px/1.2 system-ui,sans-serif}table{width:100%;border-collapse:collapse}th,td{border:1px solid #29435b;padding:5px;vertical-align:top}th{background:#0b1722;color:#93c5fd}.ok{color:#86efac}.bad{color:#fda4af}.wait{color:#fbbf24}.url{font-size:8px;color:#64748b;overflow-wrap:anywhere}</style></head><body><h1>Public CORS relay × Solana JSON-RPC POST matrix</h1><table><thead><tr><th>Relay</th><th>Result</th><th>URL</th></tr></thead><tbody id="rows"></tbody></table><script>const T='https://rpc.nodeflare.app/solana/public';const E=[['direct',T],['corsproxy.io','https://corsproxy.io/?url='+encodeURIComponent(T)],['isomorphic-git','https://cors.isomorphic-git.org/'+T],['allorigins','https://api.allorigins.win/raw?url='+encodeURIComponent(T)],['thingproxy','https://thingproxy.freeboard.io/fetch/'+T],['corsproxy.org-q','https://corsproxy.org/?'+encodeURIComponent(T)],['corsproxy.org-url','https://corsproxy.org/?url='+encodeURIComponent(T)],['cors.eu.org','https://cors.eu.org/'+T],['test-cors-workers','https://test.cors.workers.dev/?'+T],['codetabs','https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(T)],['onrender','https://corsproxy-8uo5.onrender.com/?url='+encodeURIComponent(T)],['corsmirror','https://corsmirror.com/v1/cors?url='+encodeURIComponent(T)],['cors-anywhere','https://cors-anywhere.herokuapp.com/'+T]];const body=JSON.stringify({jsonrpc:'2.0',id:1,method:'getSlot',params:[{commitment:'confirmed'}]});function call(url){const x=new XMLHttpRequest();x.open('POST',url,false);x.timeout=7000;x.setRequestHeader('content-type','application/json');try{x.send(body)}catch(e){return {c:'bad',t:'transport '+String(e).slice(0,130)}}let j;try{j=JSON.parse(x.responseText)}catch{}if(j?.result!=null)return {c:'ok',t:'slot '+j.result+' · HTTP '+x.status};if(j?.error)return {c:'bad',t:'RPC '+JSON.stringify(j.error).slice(0,180)};return {c:'bad',t:'HTTP '+x.status+' · '+String(x.responseText).replace(/\s+/g,' ').slice(0,180)}}const rows=[];for(const [n,u] of E){const r=call(u);rows.push('<tr><td>'+n+'</td><td class="'+r.c+'">'+r.t+'</td><td class="url">'+u+'</td></tr>');document.getElementById('rows').innerHTML=rows.join('')}</script></body></html>
