<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:14px;background:#071019;color:#e5edf5;font:11px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}h1{margin:0 0 8px;color:#7dd3fc;font:700 18px/1.2 system-ui,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:10px;border:1px solid #29435b;background:#0b1722}</style></head><body><h1>$555 creator wallet signature inventory</h1><pre id="out">loading...</pre><script>const RPC='https://solana-rpc.publicnode.com',W='HW8jtVSXXyvt8AbbJ2knx2jjNeSSrLbpA1QkzLGZ5iWq';function rpc(m,p){const x=new XMLHttpRequest();x.open('POST',RPC,false);x.setRequestHeader('content-type','application/json');x.send(JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}));if(x.status!==200)throw Error(m+' HTTP '+x.status+' '+x.responseText);const j=JSON.parse(x.responseText);if(j.error)throw Error(m+' '+JSON.stringify(j.error));return j.result}try{const balance=rpc('getBalance',[W,{commitment:'confirmed'}]);let all=[],before=null,pages=0;while(pages<5){const config={limit:1000,commitment:'confirmed'};if(before)config.before=before;const page=rpc('getSignaturesForAddress',[W,config]);all=all.concat(page);pages++;if(page.length<1000)break;before=page[page.length-1].signature}const lines=[];lines.push('wallet '+W);lines.push('rpc slot '+balance.context.slot+' | current SOL lamports '+balance.value);lines.push('pages '+pages+' | signatures '+all.length);if(all.length){const newest=all[0],oldest=all[all.length-1];lines.push('newest '+newest.signature+' | '+(newest.blockTime?new Date(newest.blockTime*1000).toISOString():'-')+' | slot '+newest.slot);lines.push('oldest '+oldest.signature+' | '+(oldest.blockTime?new Date(oldest.blockTime*1000).toISOString():'-')+' | slot '+oldest.slot);lines.push('\nINDEX | ISO | SLOT | STATUS | SIGNATURE | MEMO');for(let i=0;i<all.length;i++){const s=all[i];lines.push(String(i+1).padStart(4,'0')+' | '+(s.blockTime?new Date(s.blockTime*1000).toISOString():'-')+' | '+s.slot+' | '+(s.err?'ERR':'OK ')+' | '+s.signature+' | '+(s.memo||''))}}document.getElementById('out').textContent=lines.join('\n')}catch(e){document.getElementById('out').textContent='ERROR\n'+String(e.stack||e)}</script></body></html>
