<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$555 Helius forensic bridge</title><style>body{margin:0;padding:10px;background:#fff;color:#111;font:11px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace}h1{font:700 20px system-ui;margin:0 0 2px;text-align:center}.meta{text-align:center;margin:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.cell{border:1px solid #bbb;padding:2px;text-align:center;overflow:hidden}.cell img{width:470px;height:470px;object-fit:contain;image-rendering:pixelated}.cell b{display:block;font-size:9px}.err{color:#b00}pre{font-size:7px;white-space:pre-wrap;word-break:break-all;max-height:32px;overflow:hidden;margin:1px}</style></head><body><h1>$555 Helius forensic bridge</h1><div id="status" class="meta">loading</div><div id="meta" class="meta"></div><div id="grid" class="grid"></div><script>
const q=new URLSearchParams(location.search);const address=q.get('address');const apiKey=q.get('apiKey');const before=q.get('before')||'';const limit=Math.min(100,Math.max(1,Number(q.get('limit')||20)));const page=Math.max(0,Number(q.get('page')||0));const chunksPerPage=4;const chunkSize=Math.min(2100,Math.max(900,Number(q.get('chunkSize')||1700)));const snapshot=q.get('snapshot')||'2026-08-28';
if(!address||!apiKey)document.querySelector('#status').textContent='address and apiKey required';
function compactTx(x){return {signature:x.signature,timestamp:x.timestamp,type:x.type,source:x.source,fee:x.fee,feePayer:x.feePayer,description:x.description,nativeTransfers:(x.nativeTransfers||[]).map(t=>({from:t.fromUserAccount,to:t.toUserAccount,lamports:t.amount})),tokenTransfers:(x.tokenTransfers||[]).map(t=>({from:t.fromUserAccount,to:t.toUserAccount,mint:t.mint,amount:t.tokenAmount,decimals:t.decimals,standard:t.tokenStandard})),accountData:(x.accountData||[]).filter(a=>a.account===address||a.nativeBalanceChange||a.tokenBalanceChanges?.length).map(a=>({account:a.account,nativeBalanceChange:a.nativeBalanceChange,tokenBalanceChanges:(a.tokenBalanceChanges||[]).map(t=>({userAccount:t.userAccount,tokenAccount:t.tokenAccount,mint:t.mint,raw:t.rawTokenAmount}))})),swap:x.events?.swap?{nativeInput:x.events.swap.nativeInput,nativeOutput:x.events.swap.nativeOutput,tokenInputs:x.events.swap.tokenInputs,tokenOutputs:x.events.swap.tokenOutputs,innerSwaps:x.events.swap.innerSwaps}:null};}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function gzipBase64(s){const cs=new CompressionStream('gzip');const writer=cs.writable.getWriter();writer.write(new TextEncoder().encode(s));writer.close();const bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}
(async()=>{try{const url=`https://api-mainnet.helius-rpc.com/v0/addresses/${encodeURIComponent(address)}/transactions?api-key=${encodeURIComponent(apiKey)}&limit=${limit}${before?'&before='+encodeURIComponent(before):''}`;const r=await fetch(url);const text=await r.text();if(!r.ok)throw new Error(r.status+' '+text.slice(0,300));const txs=JSON.parse(text);const data={schema:'555-helius-transactions-v1',snapshot,address,before:before||null,limit,count:txs.length,newest:txs[0]?.signature||null,oldest:txs.at(-1)?.signature||null,transactions:txs.map(compactTx)};const json=JSON.stringify(data),hash=await sha(json),gz=await gzipBase64(json),chunks=[];for(let i=0;i<gz.length;i+=chunkSize)chunks.push(gz.slice(i,i+chunkSize));const start=page*chunksPerPage,subset=chunks.slice(start,start+chunksPerPage),grid=document.querySelector('#grid');for(let i=0;i<subset.length;i++){const index=start+i,payload=JSON.stringify({schema:'gzip-json-chunk-v1',dataset:'helius-transactions',snapshot,index,total:chunks.length,chunkSize,sha256:hash,encoding:'gzip+base64',data:subset[i]}),cell=document.createElement('div');cell.className='cell';cell.innerHTML=`<b>${index}/${chunks.length-1}</b><img alt="QR"><pre></pre>`;cell.querySelector('pre').textContent=payload;cell.querySelector('img').src='https://quickchart.io/qr?size=700&ecLevel=L&margin=1&text='+encodeURIComponent(payload);grid.appendChild(cell)}document.querySelector('#meta').textContent=`address=${address} tx=${txs.length} chars=${json.length} gzip64=${gz.length} chunks=${chunks.length} page=${page} sha=${hash}`;await Promise.all([...document.querySelectorAll('img')].map(img=>new Promise((res,rej)=>{img.onload=res;img.onerror=rej})));document.querySelector('#status').id='done';document.querySelector('#status').textContent='complete'}catch(e){document.querySelector('#status').id='done';document.querySelector('#status').innerHTML='<span class="err">'+String(e.stack||e)+'</span>'}})();
</script></body></html>
