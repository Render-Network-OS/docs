<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:16px;background:#071019;color:#e5edf5;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}h1{margin:0 0 14px;color:#7dd3fc;font:700 22px/1.2 system-ui,sans-serif}.row{padding:8px 10px;border-bottom:1px solid #29435b}.n{color:#94a3b8}.v{color:#fff}.good{color:#86efac}.zero{color:#fbbf24}</style></head><body><h1>$555 Pump creator-fee vault balances</h1><div id="out">loading...</div><script>const RPC='https://solana-rpc.publicnode.com';const A=[['creator wallet','HW8jtVSXXyvt8AbbJ2knx2jjNeSSrLbpA1QkzLGZ5iWq','sol'],['sharing config','6NAuFfG2g5U84qLjwQczN8s6ye866QWv8RPqbQtZJQVP','sol'],['Pump vault / creator','5rPPRnjUWrxgTAXjSMSuj6AFVKGfRUjKX739XvhZDoc7','sol'],['Pump vault / sharing','87B6vG9azvJcnKEwfmtsPoZDnSSVdSTvHPPc8j8k4E2K','sol'],['PumpSwap WSOL ATA / creator','2PUtHGxB6wWzeZjL45i3ZWE898kgHyGAsAfBHY2S319p','token'],['PumpSwap WSOL ATA / sharing','wcP6ALpxrkn19jMLcyxJzDbGsjmnvxmndEMxxVn7kBC','token']];function rpc(m,p){const x=new XMLHttpRequest();x.open('POST',RPC,false);x.setRequestHeader('content-type','application/json');x.send(JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}));const j=JSON.parse(x.responseText);if(x.status!==200||j.error)throw Error(m+' '+x.status+' '+JSON.stringify(j.error||x.responseText));return j.result}try{const slot=rpc('getSlot',[{commitment:'confirmed'}]),lines=[];for(const [label,address,kind] of A){let exists=false,lamports=0,owner=null,token=null,sigs=0;try{const ai=rpc('getAccountInfo',[address,{encoding:'jsonParsed',commitment:'confirmed'}]);exists=!!ai.value;lamports=ai.value?.lamports||0;owner=ai.value?.owner||null}catch{}try{sigs=rpc('getSignaturesForAddress',[address,{limit:1000,commitment:'confirmed'}]).length}catch{}if(kind==='token'&&exists){try{token=rpc('getTokenAccountBalance',[address,{commitment:'confirmed'}]).value}catch{}}lines.push({label,address,exists,lamports,sol:(lamports/1e9).toFixed(9),owner,token,sigs})}document.getElementById('out').innerHTML='<div class="row"><span class="n">Observed slot</span> <span class="v">'+slot+'</span></div>'+lines.map(x=>'<div class="row"><b>'+x.label+'</b><br><span class="n">'+x.address+'</span><br>exists <span class="'+(x.exists?'good':'zero')+'">'+x.exists+'</span> · lamports <span class="v">'+x.lamports+'</span> · SOL <span class="v">'+x.sol+'</span> · signatures <span class="v">'+x.sigs+'</span>'+(x.token?'<br>token amount <span class="good">'+x.token.amount+'</span> raw · <span class="good">'+x.token.uiAmountString+' WSOL</span>':'')+'</div>').join('')}catch(e){document.getElementById('out').textContent='ERROR '+String(e)}</script></body></html>
