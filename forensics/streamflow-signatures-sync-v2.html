<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:14px;background:#071019;color:#e5edf5;font:12px/1.28 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}h1{margin:0 0 8px;color:#7dd3fc;font:700 18px/1.2 system-ui,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:10px;border:1px solid #29435b;background:#0b1722}</style></head><body><h1>Streamflow URL-ID signature history v2</h1><pre id="out">loading...</pre><script>const RPC='https://solana-rpc.publicnode.com',IDS=['6jEBKmB1mUD7tpgVn35ZqxTmSvhDSqpWBVzPzUiyqttb','HHXgYtezE32aATgWQFn3knAsy2xhQsjfepps3MLe3MXN','BSkf98N8ppTciokTv56AFA8f6HU4Kux7Ee9DV63mUinQ'];function rpc(m,p){const x=new XMLHttpRequest();x.open('POST',RPC,false);x.setRequestHeader('content-type','application/json');x.send(JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}));if(x.status!==200)throw Error(m+' HTTP '+x.status+' '+x.responseText);const j=JSON.parse(x.responseText);if(j.error)throw Error(m+' '+JSON.stringify(j.error));return j.result}try{const lines=[];for(const id of IDS){lines.push('\n'+id);let acc=rpc('getAccountInfo',[id,{encoding:'base64',commitment:'confirmed'}]);lines.push('current account '+(acc.value?'PRESENT owner '+acc.value.owner+' bytes '+atob(acc.value.data[0]).length:'MISSING/CLOSED'));let sigs=rpc('getSignaturesForAddress',[id,{limit:1000,commitment:'confirmed'}]);lines.push('signature count '+sigs.length);for(let i=0;i<sigs.length;i++){const s=sigs[i];lines.push(String(i+1).padStart(3,'0')+' '+s.signature+' | '+(s.blockTime?new Date(s.blockTime*1000).toISOString():'-')+' | slot '+s.slot+' | '+(s.err?'ERR '+JSON.stringify(s.err):'OK')+' | '+(s.memo||''))}}document.getElementById('out').textContent=lines.join('\n')}catch(e){document.getElementById('out').textContent='ERROR\n'+String(e.stack||e)}</script></body></html>
