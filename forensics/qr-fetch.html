const RPCS=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];let rpcId=1;const p=new URLSearchParams(location.search);const dataset=p.get('dataset')||'compact',chunkIndex=Number(p.get('chunk')||0),chunkSize=Math.min(1100,Math.max(300,Number(p.get('chunkSize')||900)));
async function getJson(url,options={}){const r=await fetch(url,options),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(r.status+' '+String(t).slice(0,300));return d}
async function rpc(method,args=[]){let last;for(const url of RPCS){try{return await getJson(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:rpcId++,method,params:args})})}catch(e){last=e}}throw last}
async function safe(fn){try{return await fn()}catch(e){return {error:String(e)}}}
async function wallet(address){const [b,t,s,all]=await Promise.all([safe(()=>rpc('getBalance',[address,{commitment:'confirmed'}])),safe(()=>rpc('getTokenAccountsByOwner',[address,{mint:MINT},{encoding:'jsonParsed',commitment:'confirmed'}])),safe(()=>rpc('getSignaturesForAddress',[address,{limit:1000,commitment:'confirmed'}])),safe(()=>rpc('getTokenAccountsByOwner',[address,{programId:'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'},{encoding:'jsonParsed',commitment:'confirmed'}]))]);return {address,lamports:b?.result?.value??null,sol:(b?.result?.value??0)/1e9,token555:(t?.result?.value||[]).map(x=>({account:x.pubkey,raw:x.account?.data?.parsed?.info?.tokenAmount?.amount,ui:x.account?.data?.parsed?.info?.tokenAmount?.uiAmountString})),allTokens:(all?.result?.value||[]).map(x=>({account:x.pubkey,mint:x.account?.data?.parsed?.info?.mint,raw:x.account?.data?.parsed?.info?.tokenAmount?.amount,ui:x.account?.data?.parsed?.info?.tokenAmount?.uiAmountString,decimals:x.account?.data?.parsed?.info?.tokenAmount?.decimals})),sigCount:(s?.result||[]).length,newest:s?.result?.[0]?.signature||null,oldest:s?.result?.at(-1)?.signature||null};}
async function compact(){const [claim,dex,gecko,supply,mintInfo,creator,treasury,feePayer,sender,streams,largest]=await Promise.all([
 safe(()=>getJson(`https://pumpdev.io/api/claim-account?mint=${MINT}&publicKey=${CREATOR}`)),safe(()=>getJson(`https://api.dexscreener.com/latest/dex/pairs/solana/${POOL}`)),safe(()=>getJson(`https://api.geckoterminal.com/api/v2/networks/solana/pools/${POOL}`)),safe(()=>rpc('getTokenSupply',[MINT,{commitment:'confirmed'}])),safe(()=>rpc('getAccountInfo',[MINT,{encoding:'jsonParsed',commitment:'confirmed'}])),wallet(CREATOR),wallet(TREASURY),wallet(FEE_PAYER),wallet(STREAM_SENDER),Promise.all(STREAMS.map(async a=>{const [ai,sg]=await Promise.all([safe(()=>rpc('getAccountInfo',[a,{encoding:'base64',commitment:'confirmed'}])),safe(()=>rpc('getSignaturesForAddress',[a,{limit:1000,commitment:'confirmed'}]))]);const v=ai?.result?.value;return {address:a,owner:v?.owner||null,lamports:v?.lamports??null,executable:v?.executable??null,rentEpoch:v?.rentEpoch??null,data:v?.data||null,sigCount:(sg?.result||[]).length,newest:sg?.result?.[0]?.signature||null,oldest:sg?.result?.at(-1)?.signature||null}})),safe(()=>rpc('getTokenLargestAccounts',[MINT,{commitment:'confirmed'}]))]);
 const pair=dex?.pairs?.[0]||{};const ga=gecko?.data?.attributes||{};return {schema:'555-forensics-compact-v1',generatedAt:new Date().toISOString(),mint:MINT,creatorWallet:CREATOR,pumpClaim:claim,mintSupply:supply?.result?.value||supply,mintAccount:mintInfo?.result?.value?.data?.parsed||mintInfo,pair:{address:pair.pairAddress,dexId:pair.dexId,priceNative:pair.priceNative,priceUsd:pair.priceUsd,txns:pair.txns,volume:pair.volume,priceChange:pair.priceChange,liquidity:pair.liquidity,fdv:pair.fdv,marketCap:pair.marketCap,pairCreatedAt:pair.pairCreatedAt},gecko:{name:ga.name,address:ga.address,baseTokenPriceUsd:ga.base_token_price_usd,quoteTokenPriceUsd:ga.quote_token_price_usd,baseTokenPriceQuoteToken:ga.base_token_price_quote_token,fdvUsd:ga.fdv_usd,marketCapUsd:ga.market_cap_usd,reserveUsd:ga.reserve_in_usd,volumeUsd:ga.volume_usd,transactions:ga.transactions,poolCreatedAt:ga.pool_created_at},wallets:[creator,treasury,feePayer,sender],streams,largest:largest?.result?.value||largest};}
async function signatures(){const address=p.get('address')||CREATOR,before=p.get('before'),limit=Math.min(1000,Number(p.get('limit')||100));const cfg={limit,commitment:'confirmed'};if(before)cfg.before=before;const r=await rpc('getSignaturesForAddress',[address,cfg]);return {schema:'555-signatures-v1',generatedAt:new Date().toISOString(),address,before:before||null,limit,results:r?.result||[],error:r?.error||null};}
function keyAt(tx,i){const keys=tx?.transaction?.message?.accountKeys||[];const x=keys[i];return typeof x==='string'?x:x?.pubkey||null}
function tokenDeltasForOwner(tx,owner){const pre=tx?.meta?.preTokenBalances||[],post=tx?.meta?.postTokenBalances||[],map=new Map();for(const b of pre){if(b.owner!==owner)continue;const k=b.mint+'|'+b.accountIndex;map.set(k,{mint:b.mint,account:keyAt(tx,b.accountIndex),pre:b.uiTokenAmount?.amount||'0',post:'0',decimals:b.uiTokenAmount?.decimals})}for(const b of post){if(b.owner!==owner)continue;const k=b.mint+'|'+b.accountIndex;const v=map.get(k)||{mint:b.mint,account:keyAt(tx,b.accountIndex),pre:'0',post:'0',decimals:b.uiTokenAmount?.decimals};v.post=b.uiTokenAmount?.amount||'0';map.set(k,v)}return [...map.values()].map(v=>({...v,delta:(BigInt(v.post)-BigInt(v.pre)).toString()})).filter(v=>v.delta!=='0')}
function txSummary(sig,address,tx){if(!tx)return {signature:sig,missing:true};const keys=tx.transaction?.message?.accountKeys||[],idx=keys.findIndex(k=>(typeof k==='string'?k:k.pubkey)===address),pre=idx>=0?tx.meta?.preBalances?.[idx]:null,post=idx>=0?tx.meta?.postBalances?.[idx]:null;const top=(tx.transaction?.message?.instructions||[]).map(i=>({program:i.program||null,programId:i.programId||null,type:i.parsed?.type||null,info:i.parsed?.info||null}));const inner=(tx.meta?.innerInstructions||[]).flatMap(g=>g.instructions||[]).map(i=>({program:i.program||null,programId:i.programId||null,type:i.parsed?.type||null,info:i.parsed?.info||null}));return {signature:sig,slot:tx.slot,blockTime:tx.blockTime,success:tx.meta?.err==null,fee:tx.meta?.fee,addressIndex:idx,preLamports:pre,postLamports:post,solDelta:pre==null||post==null?null:post-pre,tokenDeltas:tokenDeltasForOwner(tx,address),top,inner,logMessages:tx.meta?.logMessages||[]};}
async function flows(){const address=p.get('address')||CREATOR,before=p.get('before'),limit=Math.min(50,Number(p.get('limit')||20));const cfg={limit,commitment:'confirmed'};if(before)cfg.before=before;const sr=await rpc('getSignaturesForAddress',[address,cfg]);const sigs=sr?.result||[];const rows=[];for(let i=0;i<sigs.length;i+=5){const batch=sigs.slice(i,i+5);const txs=await Promise.all(batch.map(s=>safe(()=>rpc('getTransaction',[s.signature,{encoding:'jsonParsed',maxSupportedTransactionVersion:0,commitment:'confirmed'}]))));batch.forEach((s,j)=>rows.push(txSummary(s.signature,address,txs[j]?.result)))}return {schema:'555-flows-v1',generatedAt:new Date().toISOString(),address,before:before||null,limit,oldest:sigs.at(-1)?.signature||null,rows};}
async function stream(){const address=p.get('address')||STREAMS[0];const [ai,sg]=await Promise.all([rpc('getAccountInfo',[address,{encoding:'base64',commitment:'confirmed'}]),rpc('getSignaturesForAddress',[address,{limit:1000,commitment:'confirmed'}])]);return {schema:'555-stream-account-v1',generatedAt:new Date().toISOString(),address,account:ai?.result?.value||null,signatures:sg?.result||[]};}
async function transaction(){const signature=p.get('signature');if(!signature)throw new Error('signature required');const tx=await rpc('getTransaction',[signature,{encoding:'jsonParsed',maxSupportedTransactionVersion:0,commitment:'confirmed'}]);return {schema:'555-transaction-v1',generatedAt:new Date().toISOString(),signature,result:tx?.result||null,error:tx?.error||null};}
async function getDataset(){if(dataset==='compact')return compact();if(dataset==='signatures')return signatures();if(dataset==='flows')return flows();if(dataset==='stream')return stream();if(dataset==='transaction')return transaction();throw new Error('unsupported dataset')}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
(async()=>{try{const data=await getDataset(),json=JSON.stringify(data),chunks=[];for(let i=0;i<json.length;i+=chunkSize)chunks.push(json.slice(i,i+chunkSize));const payload=JSON.stringify({schema:'qr-chunk-v1',dataset,index:chunkIndex,total:chunks.length,chunkSize,sha256:await sha256(json),data:chunks[chunkIndex]??null});document.querySelector('#meta').textContent=`dataset=${dataset} chunk=${chunkIndex}/${chunks.length-1} total=${chunks.length} chars=${json.length}`;document.querySelector('#preview').textContent=payload;document.querySelector('#qr').src='https://quickchart.io/qr?size=900&ecLevel=L&margin=1&text='+encodeURIComponent(payload);document.querySelector('#qr').onload=()=>document.querySelector('#status').textContent='complete';document.querySelector('#qr').onerror=()=>document.querySelector('#status').textContent='QR image error'}catch(e){document.querySelector('#status').innerHTML='<span class="err">'+String(e.stack||e)+'</span>'}})();
