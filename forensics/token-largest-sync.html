<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:14px;background:#071019;color:#e5edf5;font:9px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}h1{margin:0 0 8px;color:#7dd3fc;font:700 17px/1.2 system-ui,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:10px;border:1px solid #29435b;background:#0b1722}</style></head><body><h1>$555 largest token-account and owner inventory</h1><pre id="out">loading...</pre><script>const RPC='https://solana-rpc.publicnode.com',MINT='CQwwRomsuWsUCPYomZmRnwMns4ZCTASc31ExMvSysAF2';function rpc(m,p){const x=new XMLHttpRequest();x.open('POST',RPC,false);x.setRequestHeader('content-type','application/json');x.send(JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}));if(x.status!==200)throw Error(m+' HTTP '+x.status+' '+x.responseText);const j=JSON.parse(x.responseText);if(j.error)throw Error(m+' '+JSON.stringify(j.error));return j.result}try{const supply=rpc('getTokenSupply',[MINT,{commitment:'confirmed'}]);const largest=rpc('getTokenLargestAccounts',[MINT,{commitment:'confirmed'}]);const rows=[];for(const item of largest.value){const ai=rpc('getAccountInfo',[item.address,{encoding:'jsonParsed',commitment:'confirmed'}]);const info=ai.value?.data?.parsed?.info||{};const owner=info.owner||null;let ownerInfo=null,sigs=[];if(owner){try{const oi=rpc('getAccountInfo',[owner,{encoding:'base64',commitment:'confirmed'}]);ownerInfo={exists:!!oi.value,lamports:oi.value?.lamports??0,programOwner:oi.value?.owner??null,dataBytes:Array.isArray(oi.value?.data)?Math.floor((oi.value.data[0]?.length||0)*3/4):null}}catch(e){ownerInfo={error:String(e)}}try{sigs=rpc('getSignaturesForAddress',[owner,{limit:5,commitment:'confirmed'}])}catch(e){sigs=[{error:String(e)}]}}rows.push({tokenAccount:item.address,amount:item.amount,decimals:item.decimals,uiAmountString:item.uiAmountString,tokenOwner:owner,ownerInfo,ownerRecentSignatures:sigs})}document.getElementById('out').textContent=JSON.stringify({observedAt:new Date().toISOString(),supply:supply.value,rows},null,2)}catch(e){document.getElementById('out').textContent='ERROR\n'+String(e.stack||e)}</script></body></html>
