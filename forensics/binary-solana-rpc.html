<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1280,initial-scale=1"><style>html,body{margin:0;width:1280px;height:960px;overflow:hidden;background:#777}canvas{display:block;width:1280px;height:960px;image-rendering:pixelated}</style></head><body><canvas id="c" width="1280" height="960"></canvas><script>const q=new URLSearchParams(location.search),PART=Math.max(0,Number(q.get('part')||0)),CELL=4,W=1280,H=960,COLS=W/CELL,ROWS=H/CELL,CAL=64,LEVEL=[0,85,170,255],KEY='64d5184c-1e1a-41a7-aed2-04aa72576bfd';function rpc(method,params){const endpoints=['https://mainnet.helius-rpc.com/?api-key='+KEY,'https://solana-rpc.publicnode.com'];let errs=[];for(const url of endpoints){const x=new XMLHttpRequest();x.open('POST',url,false);x.setRequestHeader('content-type','application/json');x.setRequestHeader('accept','application/json');try{x.send(JSON.stringify({jsonrpc:'2.0',id:1,method,params}))}catch(e){errs.push(url+': '+e);continue}let j;try{j=JSON.parse(x.responseText)}catch(e){errs.push(url+': HTTP '+x.status+' '+x.responseText.slice(0,300));continue}if(x.status===200&&!j.error)return {endpoint:url,result:j.result};errs.push(url+': HTTP '+x.status+' '+JSON.stringify(j.error||j).slice(0,500))}throw Error(errs.join('\n'))}function parseParam(){const raw=q.get('params');if(raw)return JSON.parse(raw);const method=q.get('method'),address=q.get('address'),sig=q.get('sig');if(method==='getTokenAccountBalance')return [address,{commitment:'confirmed'}];if(method==='getAccountInfo')return [address,{encoding:q.get('encoding')||'base64',commitment:'confirmed'}];if(method==='getSignaturesForAddress')return [address,{limit:Number(q.get('limit')||1000),commitment:'confirmed'}];if(method==='getTransaction')return [sig,{encoding:'jsonParsed',commitment:'confirmed',maxSupportedTransactionVersion:0}];if(method==='getTokenSupply')return [address,{commitment:'confirmed'}];throw Error('params required for '+method)}function crc32(b){let c=0xffffffff;for(const x of b){c^=x;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}function u32(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255;a[o+2]=(v>>>16)&255;a[o+3]=(v>>>24)&255}function draw(bytes){const cap=Math.floor((COLS*ROWS-CAL)/4)-32,parts=Math.max(1,Math.ceil(bytes.length/cap)),start=PART*cap,chunk=bytes.slice(start,Math.min(bytes.length,start+cap)),h=new Uint8Array(32);h.set(new TextEncoder().encode('R555BIN3'));u32(h,8,bytes.length);u32(h,12,PART);u32(h,16,parts);u32(h,20,chunk.length);u32(h,24,crc32(bytes));u32(h,28,crc32(chunk));const a=new Uint8Array(32+chunk.length);a.set(h);a.set(chunk,32);const g=document.getElementById('c').getContext('2d',{alpha:false});let ci=0;function cell(s){const x=ci%COLS*CELL,y=Math.floor(ci/COLS)*CELL,v=LEVEL[s];g.fillStyle='rgb('+v+','+v+','+v+')';g.fillRect(x,y,CELL,CELL);ci++}for(let i=0;i<CAL;i++)cell(i%4);for(const b of a){cell(b>>>6);cell((b>>>4)&3);cell((b>>>2)&3);cell(b&3)}while(ci<COLS*ROWS)cell(0);document.body.dataset.ready='1'}try{const method=q.get('method'),params=parseParam(),data=rpc(method,params);draw(new TextEncoder().encode(JSON.stringify(['solana-rpc',{method,params},data])))}catch(e){draw(new TextEncoder().encode(JSON.stringify(['error',String(e.stack||e)])));document.body.dataset.error='1'}</script></body></html>
