ction esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function fmt(n,d){return Number(n).toFixed(d)}function related(t){const n=(t.nativeTransfers||[]).filter(x=>x.fromUserAccount===W||x.toUserAccount===W).map(x=>({from:x.fromUserAccount,to:x.toUserAccount,sol:Number(x.amount||0)/1e9}));const tok=(t.tokenTransfers||[]).filter(x=>x.fromUserAccount===W||x.toUserAccount===W||x.mint===M555||x.mint===USDC||x.mint===WSOL).map(x=>({from:x.fromUserAccount,to:x.toUserAccount,mint:x.mint,amount:x.tokenAmount,fromTA:x.fromTokenAccount,toTA:x.toTokenAccount}));return {native:n,token:tok}}try{let u='https://api-mainnet.helius-rpc.com/v0/addresses/'+W+'/transactions?api-key='+KEY+'&limit=100&token-accounts=balanceChanged&gte-time='+gte+'&lte-time='+lte+'&sort-order=asc';if(TYPE)u+='&type='+encodeURIComponent(TYPE);if(SOURCE)u+='&source='+encodeURIComponent(SOURCE);const all=get(u),rows=all.map(t=>({t,sol:nativeNet(t),wsol:tokenNet(t,WSOL),usdc:tokenNet(t,USDC),x555:tokenNet(t,M555)})).filter(r=>Math.abs(r.x555)>0.0000001);const sums=rows.reduce((a,r)=>{a.sol+=r.sol;a.wsol+=r.wsol;a.usdc+=r.usdc;a.x555+=r.x555;a.pos+=Math.max(0,r.x555);a.neg+=Math.max(0,-r.x555);return a},{sol:0,wsol:0,usdc:0,x555:0,pos:0,neg:0});document.getElementById('title').textContent='$555 '+label+' · non-zero $555 · '+(TYPE||'*')+' / '+(SOURCE||'*');let h='<div class="stats"><div class="stat"><div class="k">API returned / matching</div><div class="v">'+all.length+' / '+rows.length+'</div></div><div class="stat"><div class="k">net SOL / WSOL</div><div class="v">'+fmt(sums.sol,9)+' / '+fmt(sums.wsol,9)+'</div></div><div class="stat"><div class="k">net $555</div><div class="v">'+fmt(sums.x555,6)+'</div></div><div class="stat"><div class="k">positive / negative</div><div class="v">'+fmt(sums.pos,6)+' / '+fmt(sums.neg,6)+'</div></div></div>';rows.forEach((r,i)=>{const t=r.t,rel=related(t);h+='<div class="tx"><div class="head">#'+i+' · '+new Date(t.timestamp*1000).toISOS
