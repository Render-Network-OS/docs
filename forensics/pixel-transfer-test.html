<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}canvas{display:block;width:1280px;height:720px;image-rendering:pixelated}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>const payload=new TextEncoder().encode(JSON.stringify({magic:'PIXEL_TRANSFER_TEST',message:'The quick brown fox jumps over the lazy dog',numbers:[1,2,3,555,80000000],unicode:'$555'}));function crc32(buf){let c=0xffffffff;for(const b of buf){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}const header=new Uint8Array(20);header.set(new TextEncoder().encode('RNDRMAT1'),0);new DataView(header.buffer).setUint16(8,0);new DataView(header.buffer).setUint16(10,1);new DataView(header.buffer).setUint32(12,payload.length);new DataView(header.buffer).setUint32(16,crc32(payload));const data=new Uint8Array(header.length+payload.length);data.set(header);data.set(payload,header.length);const can=document.getElementById('c'),ctx=can.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;ctx.fillStyle='#ff00ff';ctx.fillRect(0,0,1280,720);const x0=20,y0=20,cell=4,cols=300,rows=170;ctx.fillStyle='#00ffff';ctx.fillRect(x0-4,y0-4,cols*cell+8,rows*cell+8);let n=0;for(const b of data){for(const v of [b>>4,b&15]){const col=n%cols,row=Math.floor(n/cols);const g=v*16+8;ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fillRect(x0+col*cell,y0+row*cell,cell,cell);n++}}for(;n<cols*rows;n++){const col=n%cols,row=Math.floor(n/cols);ctx.fillStyle='rgb(8,8,8)';ctx.fillRect(x0+col*cell,y0+row*cell,cell,cell)}document.body.classList.add('loaded')</script></body></html>
