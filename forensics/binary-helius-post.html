<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1280,initial-scale=1"><style>html,body{margin:0;width:1280px;height:960px;overflow:hidden;background:#777}canvas{display:block;width:1280px;height:960px;image-rendering:pixelated}</style></head><body><canvas id="c" width="1280" height="960"></canvas><script>const q=new URLSearchParams(location.search),PART=Math.max(0,Number(q.get('part')||0)),CELL=4,W=1280,H=960,COLS=W/CELL,ROWS=H/CELL,CAL=64,LEVEL=[0,85,170,255],KEY='64d5184c-1e1a-41a7-aed2-04aa72576bfd';function post(sigs){const x=new XMLHttpRequest();x.open('POST','https://api-mainnet.helius-rpc.com/v0/transactions?api-key='+KEY,false);x.setRequestHeader('content-type','application/json');x.setRequestHeader('accept','application/json');x.send(JSON.stringify({transactions:sigs}));if(x.status!==200)throw Error('HTTP '+x.status+' '+x.responseText.slice(0,1000));return JSON.parse(x.responseText)}function crc32(b){let c=0xffffffff;for(const x of b){c^=x;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}function u32(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255;a[o+2]=(v>>>16)&255;a[o+3]=(v>>>24)&255}function draw(bytes){const cap=Math.floor((COLS*ROWS-CAL)/4)-32,parts=Math.max(1,Math.ceil(bytes.length/cap)),start=PART*cap,chunk=bytes.slice(start,Math.min(bytes.length,start+cap)),h=new Uint8Array(32);h.set(new TextEncoder().encode('R555BIN3'));u32(h,8,bytes.length);u32(h,12,PART);u32(h,16,parts);u32(h,20,chunk.length);u32(h,24,crc32(bytes));u32(h,28,crc32(chunk));const a=new Uint8Array(32+chunk.length);a.set(h);a.set(chunk,32);const g=document.getElementById('c').getContext('2d',{alpha:false});let ci=0;function cell(s){const x=ci%COLS*CELL,y=Math.floor(ci/COLS)*CELL,v=LEVEL[s];g.fillStyle='rgb('+v+','+v+','+v+')';g.fillRect(x,y,CELL,CELL);ci++}for(let i=0;i<CAL;i++)cell(i%4);for(const b of a){cell(b>>>6);cell((b>>>4)&3);cell((b>>>2)&3);cell(b&3)}while(ci<COLS*ROWS)cell(0);document.body.dataset.ready='1'}try{const sigs=(q.get('sigs')||q.get('sig')||'').split(',').map(x=>x.trim()).filter(Boolean);if(!sigs.length)throw Error('sig or sigs required');const data=post(sigs);draw(new TextEncoder().encode(JSON.stringify(['helius-parsed',sigs,data])))}catch(e){draw(new TextEncoder().encode(JSON.stringify(['error',String(e.stack||e)])));document.body.dataset.error='1'}</script></body></html>
