<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#071019;color:#e5edf5;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#status{padding:12px;color:#7dd3fc}img{display:block;max-width:100%;height:auto;margin:0 auto}</style></head><body><div id="status">capturing Streamflow contract...</div><img id="shot"><script>const END='https://pageshot.site/v1/screenshot';const target='https://app.streamflow.finance/contract/solana/mainnet/BSkf98N8ppTciokTv56AFA8f6HU4Kux7Ee9DV63mUinQ';const evaluate=`document.querySelectorAll('[role="dialog"],.chakra-modal__overlay,.chakra-modal__content-container,[data-radix-dialog-overlay],[data-radix-dialog-content]').forEach(e=>e.remove());document.querySelectorAll('*').forEach(e=>{if((e.textContent||'').trim()==='Welcome to Streamflow!'){let p=e;for(let i=0;i<6&&p;i++,p=p.parentElement){p.style.display='none'}}});document.body.style.overflow='auto';document.documentElement.style.overflow='auto';window.scrollTo(0,0);`;try{const x=new XMLHttpRequest();x.open('POST',END,false);x.setRequestHeader('content-type','application/json');x.send(JSON.stringify({url:target,width:1920,height:1400,full_page:true,format:'png',delay:7000,hide_banners:true,evaluate,response:'json'}));if(x.status!==200)throw Error('HTTP '+x.status+' '+x.responseText.slice(0,500));const j=JSON.parse(x.responseText);if(!j?.data?.image)throw Error('missing image '+x.responseText.slice(0,500));document.getElementById('shot').src=j.data.image;document.getElementById('status').remove()}catch(e){document.getElementById('status').textContent='ERROR '+String(e.stack||e)}</script></body></html>
