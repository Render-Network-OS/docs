<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#071019;color:#e5edf5;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#status{padding:12px;color:#7dd3fc}img{display:block;max-width:100%;height:auto;margin:0 auto}</style></head><body><div id="status">capturing Solscan creator transactions...</div><img id="shot"><script>const endpoint='https://api-v2.solscan.io/v2/account/transaction?address=HW8jtVSXXyvt8AbbJ2knx2jjNeSSrLbpA1QkzLGZ5iWq&page=1&page_size=100';const headers={'Accept':'application/json, text/plain, */*','sol-aut':'abcdefghijklmnopB9dls0fKqrstuvwxyzABCDEF','Referer':'https://solscan.io/','Origin':'https://solscan.io'};(async()=>{try{const r=await fetch('https://pageshot.site/v1/screenshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:endpoint,width:1920,height:2200,full_page:true,format:'png',delay:1000,response:'json',headers})});const txt=await r.text();if(!r.ok)throw Error('PageShot HTTP '+r.status+' '+txt.slice(0,500));const j=JSON.parse(txt);if(!j?.data?.image)throw Error('missing image '+txt.slice(0,500));document.getElementById('shot').src=j.data.image;document.getElementById('shot').onload=()=>document.getElementById('status').remove()}catch(e){document.getElementById('status').textContent='ERROR '+String(e.stack||e)}})()</script></body></html>
