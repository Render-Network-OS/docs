<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#071019;color:#e5edf5;font:16px/1.4 ui-monospace,monospace}#status{padding:16px}img{display:block;max-width:100%;height:auto}</style></head><body><div id="status">starting sync PageShot capture…</div><img id="shot"><script>try{const x=new XMLHttpRequest();x.open('POST','https://pageshot.site/v1/screenshot',false);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify({url:'https://example.com',width:1280,height:720,format:'png',delay:500,response:'json',evaluate:"document.body.innerHTML='<pre style=\"font:48px monospace;color:white;background:#071019;padding:40px\">PAGESHOT_SYNC_OK</pre>';document.body.style.background='#071019';"}));if(x.status!==200)throw Error('HTTP '+x.status+' '+x.responseText.slice(0,500));const j=JSON.parse(x.responseText);document.getElementById('status').textContent='response keys '+Object.keys(j)+' data '+Object.keys(j.data||{});if(!j?.data?.image)throw Error('missing image '+x.responseText.slice(0,500));document.getElementById('shot').src=j.data.image}catch(e){document.getElementById('status').textContent='ERROR '+String(e.stack||e)}</script></body></html>
