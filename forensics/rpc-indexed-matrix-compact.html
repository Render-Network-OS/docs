<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:12px;background:#071019;color:#e5edf5;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}h1{margin:0 0 10px;color:#7dd3fc;font:700 18px/1.2 system-ui,sans-serif}table{width:100%;border-collapse:collapse}th,td{border:1px solid #29435b;padding:5px 6px;vertical-align:top}th{color:#93c5fd;background:#0b1722}.ok{color:#86efac}.bad{color:#fda4af}.warn{color:#fbbf24}.msg{font-size:10px;color:#94a3b8;max-width:360px;overflow-wrap:anywhere}</style></head><body><h1>$555 indexed RPC capability probe</h1><table><thead><tr><th>Endpoint</th><th>Slot</th><th>Creator sigs</th><th>Stream sigs</th><th>Known tx</th><th>Largest accounts</th></tr></thead><tbody id="rows"></tbody></table><script>const CREATOR='HW8jtVSXXyvt8AbbJ2knx2jjNeSSrLbpA1QkzLGZ5iWq',STREAM='BSkf98N8ppTciokTv56AFA8f6HU4Kux7Ee9DV63mUinQ',MINT='CQwwRomsuWsUCPYomZmRnwMns4ZCTASc31ExMvSysAF2',SIG='2YF4uZd8FhgHCjknRB2ESr6sTkEzUiooem5Phne85DHZhZKaCsQ14rLCmEHzhnFH2o58wWFM5YAPpPZ5VP5QgPLU';const E=[['mainnet-beta','https://api.mainnet-beta.solana.com'],['publicnode','https://solana-rpc.publicnode.com'],['dRPC','https://solana.drpc.org'],['Ankr','https://rpc.ankr.com/solana'],['Alchemy demo','https://solana-mainnet.g.alchemy.com/v2/demo'],['public-rpc','https://solana.public-rpc.com'],['OnFinality','https://solana.api.onfinality.io/public'],['Blast','https://solana-mainnet.public.blastapi.io'],['Phantom','https://solana-mainnet.phantom.tech'],['SolanaTracker','https://rpc.solanatracker.io/public']];function call(url,m,p){const x=new XMLHttpRequest();x.open('POST',url,false);x.setRequestHeader('content-type','application/json');try{x.send(JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}))}catch(e){return {kind:'bad',text:'transport '+String(e).slice(0,70)}}let j;try{j=JSON.parse(x.responseText)}catch{return {kind:'bad',text:'HTTP '+x.status+' '+String(x.responseText).slice(0,70)}}if(j.error)return {kind:'bad',text:'HTTP '+x.status+' '+(j.error.message||JSON.stringify(j.error)).slice(0,100)};const r=j.result;if(r===null)return {kind:'warn',text:'null'};if(Array.isArray(r))return {kind:'ok',text:'count '+r.length};if(r&&Array.isArray(r.value))return {kind:'ok',text:'count '+r.value.length};if(typeof r==='number')return {kind:'ok',text:String(r)};return {kind:'ok',text:'available'}}function td(r){return '<td class="'+r.kind+'">'+r.text+'</td>'}const rows=[];for(const [n,u] of E){const slot=call(u,'getSlot',[{commitment:'confirmed'}]);const cs=call(u,'getSignaturesForAddress',[CREATOR,{limit:5,commitment:'confirmed'}]);const ss=call(u,'getSignaturesForAddress',[STREAM,{limit:5,commitment:'confirmed'}]);const tx=call(u,'getTransaction',[SIG,{encoding:'jsonParsed',commitment:'confirmed',maxSupportedTransactionVersion:0}]);const la=call(u,'getTokenLargestAccounts',[MINT,{commitment:'confirmed'}]);rows.push('<tr><td><b>'+n+'</b><div class="msg">'+u+'</div></td>'+td(slot)+td(cs)+td(ss)+td(tx)+td(la)+'</tr>');document.getElementById('rows').innerHTML=rows.join('')}</script></body></html>
