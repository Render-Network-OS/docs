<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$555 Solana forensic bundle</title><style>body{margin:0;padding:12px;background:#fff;color:#111;font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}h1{font:700 21px system-ui;margin:0 0 3px;text-align:center}.meta{text-align:center;margin:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.cell{border:1px solid #bbb;padding:3px;text-align:center;overflow:hidden}.cell img{width:455px;height:455px;object-fit:contain;image-rendering:pixelated}.cell b{display:block;font-size:10px}.err{color:#b00}pre{font-size:8px;white-space:pre-wrap;word-break:break-all;max-height:45px;overflow:hidden;margin:2px}</style></head><body><h1>$555 Solana forensic bundle</h1><div id="status" class="meta">loading</div><div id="meta" class="meta"></div><div id="grid" class="grid"></div><script>
const MINT='CQwwRomsuWsUCPYomZmRnwMns4ZCTASc31ExMvSysAF2',CREATOR='HW8jtVSXXyvt8AbbJ2knx2jjNeSSrLbpA1QkzLGZ5iWq';
const ADDRS={creator:CREATOR,treasury:'555Tm1cfV52SrBQmnxXiHMUMrpci8miW3CkLP1Qbmtd7',fee_payer:'3tYcXT1hsJCEdLHHLzop1zRbXb9U9fp8jQEq6NfJNe2E',stream_sender:'BdEJFpK56hjdzopkmQeHiH3SwHCXrHtUMNH4jFkDTdA5'};
const RPCS=['https://solana-rpc.publicnode.com','https://solana.drpc.org','https://api.mainnet-beta.solana.com','https://rpc.ankr.com/solana'];let rpcId=1;
const raw=location.search.slice(1),n=raw.indexOf('?'),qs=n>=0?raw.slice(n+1):raw,q=new URLSearchParams(qs),dataset=q.get('dataset')||'wallet',snapshot=q.get('snapshot')||'forensic',page=Math.max(0,Number(q.get('page')||0)),chunkSize=Math.min(900,Math.max(350,Number(q.get('chunkSize')||720))),perPage=4;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function getJson(url,options={}){const r=await fetch(url,options),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(r.status+' '+String(t).slice(0,180));return d}
async function rpc(method,args=[]){const errors=[];for(const url of RPCS){for(let a=0;a<3;a++){try{const d=await getJson(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:rpcId++,method,params:args})});if(d?.error)throw new Error(JSON.stringify(d.error));return d}catch(e){errors.push(url+':'+e);await sleep(900*(a+1))}}}throw new Error(errors.join(' | '))}
async function safe(fn){try{return await fn()}catch(e){return {error:String(e)}}}
function address(){return q.get('address')||ADDRS[q.get('wallet')||'creator']||CREATOR}
async function wallet(){const a=address(),[b,t,s,all]=await Promise.all([rpc('getBalance',[a,{commitment:'finalized'}]),rpc('getTokenAccountsByOwner',[a,{mint:MINT},{encoding:'jsonParsed',commitment:'finalized'}]),rpc('getSignaturesForAddress',[a,{limit:1000,commitment:'finalized'}]),rpc('getTokenAccountsByOwner',[a,{programId:'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'},{encoding:'jsonParsed',commitment:'finalized'}])]);return {schema:'555-wallet-v1',snapshot,address:a,lamports:b.result?.value??null,sol:(b.result?.value??0)/1e9,token555:(t.result?.value||[]).map(x=>({account:x.pubkey,raw:x.account.data.parsed.info.tokenAmount.amount,ui:x.account.data.parsed.info.tokenAmount.uiAmountString,decimals:x.account.data.parsed.info.tokenAmount.decimals})),tokens:(all.result?.value||[]).map(x=>({account:x.pubkey,mint:x.account.data.parsed.info.mint,raw:x.account.data.parsed.info.tokenAmount.amount,ui:x.account.data.parsed.info.tokenAmount.uiAmountString,decimals:x.account.data.parsed.info.tokenAmount.decimals})).filter(x=>x.raw!=='0'),sigCount:(s.result||[]).length,newest:s.result?.[0]||null,oldest:s.result?.at(-1)||null}}
async function signatures(){const a=address(),before=q.get('before'),limit=Math.min(200,Number(q.get('limit')||100)),cfg={limit,commitment:'finalized'};if(before)cfg.before=before;const r=await rpc('getSignaturesForAddress',[a,cfg]);return {schema:'555-signatures-v1',snapshot,address:a,before:before||null,limit,results:(r.result||[]).map(x=>({signature:x.signature,slot:x.slot,blockTime:x.blockTime,err:x.err,memo:x.memo,confirmationStatus:x.confirmationStatus})),oldest:r.result?.at(-1)?.signature||null}}
function k(tx,i){const x=tx?.transaction?.message?.accountKeys?.[i];return typeof x==='string'?x:x?.pubkey||null}
function deltas(tx,owner){const m=new Map();for(const b of tx?.meta?.preTokenBalances||[]){if(b.owner!==owner)continue;m.set(b.mint+'|'+b.accountIndex,{mint:b.mint,account:k(tx,b.accountIndex),pre:b.uiTokenAmount?.amount||'0',post:'0',decimals:b.uiTokenAmount?.decimals})}for(const b of tx?.meta?.postTokenBalances||[]){if(b.owner!==owner)continue;const key=b.mint+'|'+b.accountIndex,v=m.get(key)||{mint:b.mint,account:k(tx,b.accountIndex),pre:'0',post:'0',decimals:b.uiTokenAmount?.decimals};v.post=b.uiTokenAmount?.amount||'0';m.set(key,v)}return [...m.values()].map(v=>({...v,delta:(BigInt(v.post)-BigInt(v.pre)).toString()})).filter(v=>v.delta!=='0')}
function summarize(sig,a,tx){if(!tx)return {signature:sig,missing:true};const keys=tx.transaction?.message?.accountKeys||[],i=keys.findIndex(x=>(typeof x==='string'?x:x.pubkey)===a),pre=i>=0?tx.meta?.preBalances?.[i]:null,post=i>=0?tx.meta?.postBalances?.[i]:null,instructions=[...(tx.transaction?.message?.instructions||[]),...(tx.meta?.innerInstructions||[]).flatMap(g=>g.instructions||[])];return {signature:sig,slot:tx.slot,blockTime:tx.blockTime,ok:tx.meta?.err==null,fee:tx.meta?.fee,solDelta:pre==null||post==null?null:post-pre,tokenDeltas:deltas(tx,a),programs:[...new Set(instructions.map(x=>x.programId||x.program).filter(Boolean))],types:[...new Set(instructions.map(x=>x.parsed?.type).filter(Boolean))],transfers:instructions.filter(x=>['transfer','transferChecked','burn','burnChecked','closeAccount'].includes(x.parsed?.type)).map(x=>({program:x.program,type:x.parsed.type,info:x.parsed.info})),logs:(tx.meta?.logMessages||[]).filter(x=>/pump|swap|stream|transfer|burn|claim/i.test(x)).slice(0,10)}}
async function flows(){const a=address(),before=q.get('before'),limit=Math.min(25,Number(q.get('limit')||10)),cfg={limit,commitment:'finalized'};if(before)cfg.before=before;const sr=await rpc('getSignaturesForAddress',[a,cfg]),sigs=sr.result||[],rows=[];for(const s of sigs){const r=await safe(()=>rpc('getTransaction',[s.signature,{encoding:'jsonParsed',maxSupportedTransactionVersion:0,commitment:'finalized'}]));rows.push(summarize(s.signature,a,r.result));await sleep(350)}return {schema:'555-flows-v1',snapshot,address:a,before:before||null,limit,oldest:sigs.at(-1)?.signature||null,rows}}
async function mint(){const [s,a,l]=await Promise.all([rpc('getTokenSupply',[MINT,{commitment:'finalized'}]),rpc('getAccountInfo',[MINT,{encoding:'jsonParsed',commitment:'finalized'}]),rpc('getTokenLargestAccounts',[MINT,{commitment:'finalized'}])]);return {schema:'555-mint-v1',snapshot,mint:MINT,supply:s.result?.value||null,account:a.result?.value||null,largest:l.result?.value||[]}}
async function stream(){const a=address(),[ai,sg]=await Promise.all([rpc('getAccountInfo',[a,{encoding:'base64',commitment:'finalized'}]),rpc('getSignaturesForAddress',[a,{limit:1000,commitment:'finalized'}])]);return {schema:'555-stream-v1',snapshot,address:a,account:ai.result?.value||null,sigCount:(sg.result||[]).length,newest:sg.result?.[0]||null,oldest:sg.result?.at(-1)||null}}
async function transaction(){const signature=q.get('signature');if(!signature)throw new Error('signature required');const r=await rpc('getTransaction',[signature,{encoding:'jsonParsed',maxSupportedTransactionVersion:0,commitment:'finalized'}]);return {schema:'555-transaction-v1',snapshot,signature,result:r.result||null}}
async function data(){if(dataset==='wallet')return wallet();if(dataset==='signatures')return signatures();if(dataset==='flows')return flows();if(dataset==='mint')return mint();if(dataset==='stream')return stream();if(dataset==='transaction')return transaction();throw new Error('unsupported dataset')}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
(async()=>{try{const d=await data(),j=JSON.stringify(d),hash=await sha(j),chunks=[];for(let i=0;i<j.length;i+=chunkSize)chunks.push(j.slice(i,i+chunkSize));const start=page*perPage,subset=chunks.slice(start,start+perPage),grid=document.querySelector('#grid');for(let x=0;x<subset.length;x++){const index=start+x,payload=JSON.stringify({schema:'qr-chunk-v3',dataset,snapshot,index,total:chunks.length,chunkSize,sha256:hash,data:subset[x]}),cell=document.createElement('div');cell.className='cell';cell.innerHTML='<b>'+dataset+' '+index+'/'+(chunks.length-1)+'</b><img alt="QR"><pre></pre>';cell.querySelector('pre').textContent=payload;cell.querySelector('img').src='https://quickchart.io/qr?size=700&ecLevel=L&margin=1&text='+encodeURIComponent(payload);grid.appendChild(cell)}document.querySelector('#meta').textContent=`dataset=${dataset} page=${page} chunks=${chunks.length} chars=${j.length} sha=${hash}`;await Promise.all([...document.querySelectorAll('img')].map(img=>new Promise((r,j)=>{img.onload=r;img.onerror=j})));document.querySelector('#status').id='done';document.querySelector('#status').textContent='complete'}catch(e){document.querySelector('#status').id='done';document.querySelector('#status').innerHTML='<span class="err">'+e+'</span>'}})();
</script></body></html>
