<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:12px;background:#071019;color:#e5edf5;font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}h1{margin:0 0 10px;color:#7dd3fc;font:700 18px/1.2 system-ui,sans-serif}table{width:100%;border-collapse:collapse}th,td{border:1px solid #29435b;padding:5px}th{background:#0b1722;color:#93c5fd}.ok{color:#86efac}.bad{color:#fda4af}.warn{color:#fbbf24}.url{font-size:8px;color:#64748b;overflow-wrap:anywhere}</style></head><body><h1>Additional public archive RPC probe</h1><table><thead><tr><th>Endpoint</th><th>Slot</th><th>Creator history</th><th>Known tx</th></tr></thead><tbody id="rows"></tbody></table><script>const CREATOR='HW8jtVSXXyvt8AbbJ2knx2jjNeSSrLbpA1QkzLGZ5iWq',SIG='2YF4uZd8FhgHCjknRB2ESr6sTkEzUiooem5Phne85DHZhZKaCsQ14rLCmEHzhnFH2o58wWFM5YAPpPZ5VP5QgPLU';const E=[['BlockPI','https://solana.blockpi.network/v1/rpc/public'],['Extrnode','https://solana-mainnet.rpc.extrnode.com'],['Lava','https://solana.lava.build'],['RPCPool','https://solana.rpcpool.com']];function call(url,m,p){const x=new XMLHttpRequest();x.open('POST',url,false);x.setRequestHeader('content-type','application/json');try{x.send(JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}))}catch(e){return {c:'bad',t:'transport '+String(e).slice(0,100)}}let j;try{j=JSON.parse(x.responseText)}catch{return {c:'bad',t:'HTTP '+x.status+' '+String(x.responseText).slice(0,100)}}if(j.error)return {c:'bad',t:'RPC '+(j.error.message||JSON.stringify(j.error)).slice(0,120)};const r=j.result;if(r===null)return {c:'warn',t:'null'};if(Array.isArray(r))return {c:'ok',t:'count '+r.length+(r[0]?.signature?' · '+r[0].signature.slice(0,12):'')};if(typeof r==='number')return {c:'ok',t:String(r)};return {c:'ok',t:'available · slot '+(r.slot||'?')+' · time '+(r.blockTime||'?')+' · fee '+(r.meta?.fee||'?')}}function td(r){return '<td class="'+r.c+'">'+r.t+'</td>'}const rows=[];for(const [n,u] of E){rows.push('<tr><td><b>'+n+'</b><div class="url">'+u+'</div></td>'+td(call(u,'getSlot',[{commitment:'confirmed'}]))+td(call(u,'getSignaturesForAddress',[CREATOR,{limit:10,commitment:'confirmed'}]))+td(call(u,'getTransaction',[SIG,{encoding:'jsonParsed',commitment:'confirmed',maxSupportedTransactionVersion:0}]))+'</tr>');document.getElementById('rows').innerHTML=rows.join('')}</script></body></html>
