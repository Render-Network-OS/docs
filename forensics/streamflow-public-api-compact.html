<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#071019;color:#e5edf5;font:18px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{padding:18px}h1{margin:0 0 14px;color:#7dd3fc;font:700 28px/1.2 system-ui,sans-serif}.card{margin:0 0 18px;padding:14px;border:2px solid #29435b;background:#0b1722}.title{font:700 22px/1.2 system-ui,sans-serif;color:#93c5fd;margin-bottom:8px}.row{margin:4px 0;overflow-wrap:anywhere}.k{color:#94a3b8}.v{color:#fff}.good{color:#86efac}.bad{color:#fda4af}pre{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>$555 Streamflow on-chain lock records</h1><div id="out">Loading public API records…</div><script>const base='https://api-public.streamflow.finance/v2/api/contracts/tabularium/';const ids=[['555 Token Lock','BSkf98N8ppTciokTv56AFA8f6HU4Kux7Ee9DV63mUinQ'],['Dev recruit','HHXgYtezE32aATgWQFn3knAsy2xhQsjfepps3MLe3MXN'],['DIY Token Lock','6jEBKmB1mUD7tpgVn35ZqxTmSvhDSqpWBVzPzUiyqttb']];function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function row(k,v,cls='v'){return `<div class="row"><span class="k">${esc(k)}:</span> <span class="${cls}">${esc(v)}</span></div>`}function pick(d){return {address:d.address,name:d.name,contractType:d.contractType,sender:d.sender,recipient:d.recipient,payer:d.payer,mint:d.mint,escrow:d.escrow,amount:d.amount,claimedAmount:d.claimedAmount,cliffAmount:d.cliffAmount,amountPerPeriod:d.amountPerPeriod,period:d.period,autoClaimPeriod:d.autoClaimPeriod,createdDt:d.createdDt,startDt:d.startDt,endDt:d.endDt,canceledDt:d.canceledDt,lastClaimedDt:d.lastClaimedDt,isClosed:d.isClosed,isFucked:d.isFucked,canTopup:d.canTopup,isCancelableBySender:d.isCancelableBySender,isCancelableByRecipient:d.isCancelableByRecipient,isTransferableBySender:d.isTransferableBySender,isTransferableByRecipient:d.isTransferableByRecipient,streamflowFee:d.streamflowFee,streamflowFeeWithdrawn:d.streamflowFeeWithdrawn,streamflowFeePercentage:d.streamflowFeePercentage,partnerFee:d.partnerFee,partnerFeeWithdrawn:d.partnerFeeWithdrawn,partnerFeePercentage:d.partnerFeePercentage,txFee:d.txFee,lastUpdateSlot:d.lastUpdateSlot,programId:d.programId}}async function one(label,id){try{const r=await fetch(base+id,{headers:{accept:'application/json'}});const t=await r.text();if(!r.ok)throw new Error(`HTTP ${r.status} ${t.slice(0,300)}`);const j=JSON.parse(t);const d=j.data??j;const p=pick(d);return `<section class="card"><div class="title">${esc(label)}</div>${Object.entries(p).map(([k,v])=>row(k,typeof v==='object'?JSON.stringify(v):v,(/^amount|claimed|fee/i.test(k)?'good':'v'))).join('')}</section>`}catch(e){return `<section class="card"><div class="title">${esc(label)}</div>${row('ERROR',e.stack||e,'bad')}</section>`}}(async()=>{document.getElementById('out').innerHTML=(await Promise.all(ids.map(x=>one(...x)))).join('');document.body.classList.add('loaded')})()</script></body></html>
