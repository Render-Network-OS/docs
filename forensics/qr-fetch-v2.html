const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function getJson(url,options={}){const r=await fetch(url,options),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(r.status+' '+String(t).slice(0,250));return d}

function keyAt(tx,i){const x=(tx?.transaction?.message?.accountKeys||[])[i];return typeof x==='string'?x:x?.pubkey||null}function tokenDeltas(tx,owner){const m=new Map();for(const b of tx?.meta?.preTokenBalances||[]){if(b.owner!==owner)continue;m.set(b.mint+'|'+b.accountIndex,{mint:b.mint,account:keyAt(tx,b.accountIndex),pre:b.uiTokenAmount?.amount||'0',post:'0',decimals:b.uiTokenAmount?.decimals})}for(const b of tx?.meta?.postTokenBalances||[]){if(b.owner!==owner)continue;const k=b.mint+'|'+b.accountIndex,v=m.get(k)||{mint:b.mint,account:keyAt(tx,b.accountIndex),pre:'0',post:'0',decimals:b.uiTokenAmount?.decimals};v.post=b.uiTokenAmount?.amount||'0';m.set(k,v)}return [...m.values()].map(v=>({...v,delta:(BigInt(v.post)-BigInt(v.pre)).toString()})).filter(v=>v.delta!=='0')}
