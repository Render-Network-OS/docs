<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#071019;color:#e5edf5;font:14px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{padding:14px}h1{margin:0 0 12px;color:#7dd3fc;font:700 23px/1.2 system-ui,sans-serif}h2{color:#93c5fd;font:700 18px/1.2 system-ui,sans-serif;margin:14px 0 6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:9px;border:1px solid #29435b;background:#0b1722}.e{color:#fda4af}</style></head><body><h1>SolanaFM indexed histories for Streamflow lock IDs</h1><div id="out">Loading…</div><script>const IDS=[['555 Token Lock','BSkf98N8ppTciokTv56AFA8f6HU4Kux7Ee9DV63mUinQ'],['Dev recruit','HHXgYtezE32aATgWQFn3knAsy2xhQsjfepps3MLe3MXN'],['DIY Token Lock','6jEBKmB1mUD7tpgVn35ZqxTmSvhDSqpWBVzPzUiyqttb']];function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function slim(x){if(Array.isArray(x))return x.map(t=>({signature:t.signature??t.transactionHash??t.hash??t.txHash,slot:t.slot??t.blockNumber,blockTime:t.blockTime??t.timestamp??t.utc,success:t.success??t.status,fee:t.fee,actions:t.actions,programs:t.programs,inflow:t.inflow,outflow:t.outflow,data:t}));return x}(async()=>{const cards=[];for(const [label,id] of IDS){try{const u=`https://api.solana.fm/v0/accounts/${id}/transactions?limit=1000&page=1`,r=await fetch(u,{headers:{accept:'application/json'}}),t=await r.text();if(!r.ok)throw Error(`HTTP ${r.status} ${t.slice(0,500)}`);const j=JSON.parse(t),s=slim(j);cards.push(`<h2>${label} — ${id} — ${Array.isArray(j)?j.length:'object'} records</h2><pre>${esc(JSON.stringify(s,null,2))}</pre>`)}catch(e){cards.push(`<h2>${label}</h2><pre class="e">ERROR ${esc(e.stack||e)}</pre>`)}}document.getElementById('out').innerHTML=cards.join('');document.body.classList.add('loaded')})()</script></body></html>
