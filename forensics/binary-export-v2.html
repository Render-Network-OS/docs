<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1280,initial-scale=1"><style>html,body{margin:0;width:1280px;height:960px;overflow:hidden;background:#777}canvas{display:block;width:1280px;height:960px;image-rendering:pixelated}</style></head><body><canvas id="c" width="1280" height="960"></canvas><script>
const q=new URLSearchParams(location.search),MODE=q.get('mode')||'test',PART=Math.max(0,Number(q.get('part')||0)),CELL=4,W=1280,H=960,COLS=Math.floor(W/CELL),ROWS=Math.floor(H/CELL),CAL=64;
const LEVEL=[0,85,170,255];
const HELIUS_KEY='64d5184c-1e1a-41a7-aed2-04aa72576bfd';
const M555='CQwwRomsuWsUCPYomZmRnwMns4ZCTASc31ExMvSysAF2',USDC='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v',WSOL='So11111111111111111111111111111111111111112';
function xhrGet(url){const x=new XMLHttpRequest();x.open('GET',url,false);x.setRequestHeader('accept','application/json');x.send();if(x.status!==200)throw Error('GET '+url+' HTTP '+x.status+' '+x.responseText.slice(0,1000));return JSON.parse(x.responseText)}
function trimHelius(a,wallet){return (a||[]).map(t=>({signature:t.signature,timestamp:t.timestamp,type:t.type,source:t.source,fee:t.fee,feePayer:t.feePayer,error:t.error??null,description:t.description??'',nativeTransfers:(t.nativeTransfers||[]).filter(x=>x.fromUserAccount===wallet||x.toUserAccount===wallet).map(x=>({from:x.fromUserAccount,to:x.toUserAccount,amount:x.amount})),tokenTransfers:(t.tokenTransfers||[]).filter(x=>x.fromUserAccount===wallet||x.toUserAccount===wallet||x.mint===M555||x.mint===USDC||x.mint===WSOL).map(x=>({fromUser:x.fromUserAccount,toUser:x.toUserAccount,fromToken:x.fromTokenAccount,toToken:x.toTokenAccount,mint:x.mint,amount:x.tokenAmount,standard:x.tokenStandard})),accountData:(t.accountData||[]).filter(x=>x.account===wallet||(x.tokenBalanceChanges||[]).some(z=>z.userAccount===wallet||z.mint===M555||z.mint===USDC||z.mint===WSOL)).map(x=>({account:x.account,nativeBalanceChange:x.nativeBalanceChange,tokenBalanceChanges:(x.tokenBalanceChanges||[]).filter(z=>z.userAccount===wallet||z.mint===M555||z.mint===USDC||z.mint===WSOL)})),events:t.events??null}));}
function payload(){if(MODE==='test'){const n=Number(q.get('n')||10000);return {kind:'test',n,text:Array.from({length:n},(_,i)=>String.fromCharCode(32+(i*17)%95)).join('')}}
if(MODE==='helius'){const wallet=q.get('address');if(!wallet)throw Error('address required');const from=q.get('from')||'2025-01-01',to=q.get('to')||'2026-08-30',gte=Math.floor(new Date(from+'T00:00:00Z').getTime()/1000),lte=Math.floor(new Date(to+'T23:59:59Z').getTime()/1000);let u='https://api-mainnet.helius-rpc.com/v0/addresses/'+wallet+'/transactions?api-key='+HELIUS_KEY+'&limit='+(q.get('limit')||100)+'&token-accounts=balanceChanged&gte-time='+gte+'&lte-time='+lte+'&sort-order='+(q.get('sort')||'asc');if(q.get('type'))u+='&type='+encodeURIComponent(q.get('type'));if(q.get('source'))u+='&source='+encodeURIComponent(q.get('source'));if(q.get('before'))u+='&before-signature='+encodeURIComponent(q.get('before'));const raw=xhrGet(u);return {kind:'helius',wallet,from,to,type:q.get('type')||null,source:q.get('source')||null,returned:raw.length,records:trimHelius(raw,wallet)}}
if(MODE==='heliusHistory'){const wallet=q.get('address');let u='https://api.helius.xyz/v1/wallet/'+wallet+'/history?api-key='+HELIUS_KEY+'&limit='+(q.get('limit')||100)+'&tokenAccounts=balanceChanged';if(q.get('before'))u+='&before='+encodeURIComponent(q.get('before'));const raw=xhrGet(u);return {kind:'heliusHistory',wallet,pagination:raw.pagination,data:raw.data}}
if(MODE==='streamflow'){let u=q.get('url');if(!u){const id=q.get('id'),mint=q.get('mint'),sender=q.get('sender'),recipient=q.get('recipient');u='https://api-public.streamflow.finance/v2/api/contracts/tabularium/'+(id||'');const p=new URLSearchParams();if(mint)p.set('mint',mint);if(sender)p.set('sender',sender);if(recipient)p.set('recipient',recipient);if([...p].length)u+=(u.includes('?')?'&':'?')+p.toString()}return {kind:'streamflow',url:u,data:xhrGet(u)}}
if(MODE==='url'){const u=q.get('url');return {kind:'url',url:u,data:xhrGet(u)}}throw Error('unknown mode '+MODE)}
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
function u32(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255;a[o+2]=(v>>>16)&255;a[o+3]=(v>>>24)&255}
function draw(bytes){const cells=COLS*ROWS-CAL,capacity=Math.floor(cells/4)-32,parts=Math.max(1,Math.ceil(bytes.length/capacity)),start=PART*capacity,chunk=bytes.slice(start,Math.min(bytes.length,start+capacity)),head=new Uint8Array(32);head.set(new TextEncoder().encode('R555BIN2'),0);u32(head,8,bytes.length);u32(head,12,PART);u32(head,16,parts);u32(head,20,chunk.length);u32(head,24,crc32(bytes));u32(head,28,crc32(chunk));const all=new Uint8Array(head.length+chunk.length);all.set(head);all.set(chunk,head.length);const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});g.imageSmoothingEnabled=false;g.fillStyle='#777';g.fillRect(0,0,W,H);let ci=0;function cell(sym){const x=(ci%COLS)*CELL,y=Math.floor(ci/COLS)*CELL,v=LEVEL[sym];g.fillStyle='rgb('+v+','+v+','+v+')';g.fillRect(x,y,CELL,CELL);ci++}for(let i=0;i<CAL;i++)cell(i%4);for(const b of all){cell((b>>>6)&3);cell((b>>>4)&3);cell((b>>>2)&3);cell(b&3)}while(ci<COLS*ROWS)cell(0);document.body.dataset.ready='1';document.title='R555 '+MODE+' '+PART+'/'+parts+' '+chunk.length+'/'+bytes.length}
try{draw(new TextEncoder().encode(JSON.stringify(payload())))}catch(e){draw(new TextEncoder().encode(JSON.stringify({kind:'error',message:String(e.stack||e)})));document.body.dataset.error='1'}
</script></body></html>
