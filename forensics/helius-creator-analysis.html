<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:14px;background:#071019;color:#e5edf5;font:12px/1.32 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}h1{margin:0 0 8px;color:#7dd3fc;font:700 20px/1.2 system-ui,sans-serif}h2{margin:16px 0 6px;color:#93c5fd;font:700 15px/1.2 system-ui,sans-serif}.meta{color:#94a3b8;margin:4px 0 10px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #29435b;padding:5px;vertical-align:top;overflow-wrap:anywhere}th{background:#0b1722;color:#93c5fd}.sig{width:12%}.date{width:10%}.type{width:10%}.num{width:8%;text-align:right}.desc{width:36%}.pos{color:#86efac}.neg{color:#fda4af}.zero{color:#94a3b8}.small{font-size:9px;color:#94a3b8}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1722;border:1px solid #29435b;padding:8px}</style></head><body><h1>$555 creator-wallet onchain history</h1><div id="status" class="meta">Loading Helius enhanced transactions...</div><div id="out"></div><script>const KEY='64d5184c-1e1a-41a7-aed2-04aa72576bfd',BASE='https://api-mainnet.helius-rpc.com/v0/addresses',W='HW8jtVSXXyvt8AbbJ2knx2jjNeSSrLbpA1QkzLGZ5iWq',M='CQwwRomsuWsUCPYomZmRnwMns4ZCTASc31ExMvSysAF2';function get(url){const x=new XMLHttpRequest();x.open('GET',url,false);x.setRequestHeader('accept','application/json');x.send();if(x.status!==200)throw Error('HTTP '+x.status+' '+x.responseText.slice(0,500));return JSON.parse(x.responseText)}function all(){let out=[],before='';for(let p=0;p<30;p++){let u=BASE+'/'+W+'/transactions?api-key='+KEY+'&limit=100&token-accounts=balanceChanged';if(before)u+='&before-signature='+encodeURIComponent(before);const a=get(u);if(!Array.isArray(a)||!a.length)break;out.push(...a);const next=a[a.length-1].signature;if(!next||next===before)break;before=next;if(a.length<100)break}return out}function solNet(t){let n=0;for(const x of t.nativeTransfers||[]){if(x.toUserAccount===W)n+=Number(x.amount||0);if(x.fromUserAccount===W)n-=Number(x.amount||0)}return n/1e9}function tokNet(t){let n=0;for(const x of t.tokenTransfers||[]){if(x.mint!==M)continue;if(x.toUserAccount===W)n+=Number(x.tokenAmount||0);if(x.fromUserAccount===W)n-=Number(x.tokenAmount||0)}return n}function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function cls(n){return n>0?'pos':n<0?'neg':'zero'}try{const tx=all(),types={},sources={};for(const t of tx){types[t.type]=(types[t.type]||0)+1;sources[t.source]=(sources[t.source]||0)+1}const candidates=tx.map(t=>({t,sol:solNet(t),tok:tokNet(t)})).filter(x=>Math.abs(x.sol)>=.005||Math.abs(x.tok)>0||['SWAP','TRANSFER','CLAIM_FEE','WITHDRAW','DEPOSIT','BURN'].includes(x.t.type)||/claim|swap|fee|stream|lock|burn|jupiter|pump/i.test(x.t.description||''));let html='<div class="meta">Observed '+new Date().toISOString()+' · '+tx.length+' transactions · '+candidates.length+' capital candidates</div>';html+='<h2>Counts</h2><pre>'+esc(JSON.stringify({types,sources,newest:tx[0]?.timestamp?new Date(tx[0].timestamp*1000).toISOString():null,oldest:tx.at(-1)?.timestamp?new Date(tx.at(-1).timestamp*1000).toISOString():null},null,2))+'</pre>';html+='<h2>Capital candidates</h2><table><thead><tr><th class="date">Date</th><th class="sig">Signature</th><th class="type">Type / source</th><th class="num">Net SOL</th><th class="num">Net $555</th><th class="desc">Description and transfers</th></tr></thead><tbody>';for(const x of candidates){const t=x.t;const transfers={native:t.nativeTransfers||[],token:(t.tokenTransfers||[]).filter(z=>z.mint===M||z.fromUserAccount===W||z.toUserAccount===W)};html+='<tr><td>'+new Date(t.timestamp*1000).toISOString()+'</td><td>'+esc(t.signature)+'</td><td>'+esc(t.type)+'<br><span class="small">'+esc(t.source)+'</span></td><td class="'+cls(x.sol)+'">'+x.sol.toFixed(9)+'</td><td class="'+cls(x.tok)+'">'+x.tok.toLocaleString(undefined,{maximumFractionDigits:9})+'</td><td>'+esc(t.description)+'<div class="small">'+esc(JSON.stringify(transfers))+'</div></td></tr>'}html+='</tbody></table>';document.getElementById('status').remove();document.getElementById('out').innerHTML=html;document.body.dataset.ready='1'}catch(e){document.getElementById('status').textContent='ERROR '+String(e.stack||e);document.body.dataset.ready='error'}</script></body></html>
