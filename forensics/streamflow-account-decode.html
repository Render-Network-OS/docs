cument.getElementById('out').textContent='ERROR: no RPC available';function rpc(m,p){return rpcAt(RPC,m,p)}function bytes64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}function reader(a){let o=0;const d=new DataView(a.buffer,a.byteOffset,a.byteLength);return{pos:()=>o,blob:n=>{const x=a.slice(o,o+n);o+=n;return x},u8:()=>a[o++],u32:()=>{const x=d.getUint32(o,true);o+=4;return x},u64:()=>{let x=0n;for(let i=7;i>=0;i--)x=(x<<8n)+BigInt(a[o+i]);o+=8;return x},f32:()=>{const x=d.getFloat32(o,true);o+=4;return x}}}function str(a){return new TextDecoder().decode(a).replace(/\0+$/,'').trim()}function iso(n){const x=Number(n);return x>0?new Date(x*1000).toISOString():null}function dec(raw,dp){const n=BigInt(raw),p=10n**BigInt(dp),w=n/p,f=(n%p).toString().padStart(dp,'0').replace(/0+$/,'');return f?`${w}.${f}`:`${w}`}function decode(a){const r=reader(a),x={};x.magic=Array.from(r.blob(8));x.version=r.u8();x.createdAt=r.u64();x.withdrawnAmount=r.u64();x.canceledAt=r.u64();x.end=r.u64();x.lastWithdrawnAt=r.u64();x.sender=b58(r.blob(32));x.senderTokens=b58(r.blob(32));x.recipient=b58(r.blob(32));x.recipientTokens=b58(r.blob(32));x.mint=b58(r.blob(32));x.escrowTokens=b58(r.blob(32));x.streamflowTreasury=b58(r.blob(32));x.streamflowTreasuryTokens=b58(r.blob(32));x.streamflowFeeTotal=r.u64();x.streamflowFeeWithdrawn=r.u64();x.streamflowFeePercent=r.f32();x.partner=b58(r.blob(32));x.partnerTokens=b58(r.blob(32));x.partnerFeeTotal=r.u64();x.partnerFeeWithdrawn=r.u64();x.partnerFeePercent=r.f32();x.start=r.u64();x.depositedAmount=r.u64();x.period=r.u64();x.amountPerPeriod=r.u64();x.cliff=r.u64();x.cliffAmount=r.u64();x.cancelableBySender=!!r.u8();x.cancelableByRecipient=!!r.u8();x.automaticWithdrawal=!!r.u8();x.transferableBySender=!!r.u8();x.transferableByRecipient=!!r.u8();x.canTopup=!!r.u8();x.name=str(r.blob(64));x.withdrawFrequency=r.u64();x.ghost=Array.from(r.blob(4));x.pausable=!!r.u8();x.canUpdateRate=!!r.u8();x.ghost2
