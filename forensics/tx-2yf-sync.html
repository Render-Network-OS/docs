<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:14px;background:#071019;color:#e5edf5;font:9px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}h1{margin:0 0 8px;color:#7dd3fc;font:700 17px/1.2 system-ui,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:10px;border:1px solid #29435b;background:#0b1722}</style></head><body><h1>Known Solana transaction — parsed reconstruction</h1><pre id="out">loading...</pre><script>const RPC='https://solana-rpc.publicnode.com',SIG='2YF4uZd8FhgHCjknRB2ESr6sTkEzUiooem5Phne85DHZhZKaCsQ14rLCmEHzhnFH2o58wWFM5YAPpPZ5VP5QgPLU';function rpc(m,p){const x=new XMLHttpRequest();x.open('POST',RPC,false);x.setRequestHeader('content-type','application/json');x.send(JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}));if(x.status!==200)throw Error(m+' HTTP '+x.status+' '+x.responseText);const j=JSON.parse(x.responseText);if(j.error)throw Error(m+' '+JSON.stringify(j.error));return j.result}try{const tx=rpc('getTransaction',[SIG,{encoding:'jsonParsed',commitment:'confirmed',maxSupportedTransactionVersion:0}]);if(!tx)throw Error('transaction not found');const msg=tx.transaction.message;const keys=msg.accountKeys.map((k,i)=>({i,pubkey:k.pubkey||k,signer:!!k.signer,writable:!!k.writable,preLamports:tx.meta.preBalances[i],postLamports:tx.meta.postBalances[i],deltaLamports:tx.meta.postBalances[i]-tx.meta.preBalances[i]}));const ins=(msg.instructions||[]).map((ix,i)=>({i,program:ix.program,programId:ix.programId,parsed:ix.parsed,accounts:ix.accounts,data:ix.data}));const inner=(tx.meta.innerInstructions||[]).map(g=>({index:g.index,instructions:g.instructions.map(ix=>({program:ix.program,programId:ix.programId,parsed:ix.parsed,accounts:ix.accounts,data:ix.data}))}));document.getElementById('out').textContent=JSON.stringify({signature:SIG,slot:tx.slot,blockTime:tx.blockTime,iso:tx.blockTime?new Date(tx.blockTime*1000).toISOString():null,fee:tx.meta.fee,status:tx.meta.err?'ERR':'OK',computeUnitsConsumed:tx.meta.computeUnitsConsumed,keys,instructions:ins,innerInstructions:inner,preTokenBalances:tx.meta.preTokenBalances,postTokenBalances:tx.meta.postTokenBalances,logMessages:tx.meta.logMessages},null,2)}catch(e){document.getElementById('out').textContent='ERROR\n'+String(e.stack||e)}</script></body></html>
