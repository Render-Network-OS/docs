gnature??t.txHash??t.tx_hash??'';return `<tr><td class="${buy?'buy':'sell'}">${buy?'BUY':'SELL'}</td><td>${ts(t.timestamp??t.created_timestamp??t.blockTime)}</td><td class="wallet">${esc(wallet)}</td><td class="num">${n(sol,9)}</td><td class="num">${n(tok,6)}</td><td class="sig">${esc(sig)}</td></tr>`}function table(title,arr){return `<h2>${esc(title)} · ${arr.length}</h2><table><thead><tr><th>side</th><th>time UTC</th><th>wallet</th><th>SOL raw/API</th><th>$555 raw/API</th><th>signature</th></tr></thead><tbody>${arr.map(row).join('')}</tbody></table>`}try{let all=[];let offset=0;const limit=200;for(let page=0;page<80;page++){document.getElementById('status').textContent=`loading page ${page+1}, offset ${offset}…`;const x=new XMLHttpRequest();x.open('GET',`${API}?limit=${limit}&offset=${offset}&minimumSize=0`,false);x.setRequestHeader('Accept','application/json, text/plain, */*');x.setRequestHeader('Origin','https://pump.fun');x.send();if(x.status!==200)throw Error(`HTTP ${x.status} offset ${offset}: ${x.responseText.slice(0,500)}`);const j=JSON.parse(x.responseText);const batch=Array.isArray(j)?j:(Array.isArray(j.trades)?j.trades:(Array.isArray(j.data)?j.data:[]));if(!batch.length)break;all=all.concat(batch);offset+=batch.length;if(batch.length<limit)break}const norm=all.map(t=>{const buy=t.is_buy===true||t.isBuy===true||String(t.type||'').toLowerCase()==='buy';const sol=Number(t.sol_amount??t.solAmount??t.quote_amount??t.quoteAmount??0);const tok=Number(t.token_amount??t.tokenAmount??t.base_amount??t.baseAmount??0);const wallet=t.user??t.user_public_key??t.wallet??t.owner??t.trader??'';return {...t,__buy:buy,__sol:sol,__tok:tok,__wallet:wallet,__time:Number(t.timestamp??t.created_timestamp??t.blockTime??0)}});const buys=norm.filter(t=>t.__buy);const known=norm.filter(t=>KNOWN.has(t.__wallet));const top=buys.slice().sort((a,b)=>b.__sol-a.__sol).slice(0,250);const whale=buys.filter(t=>t.__tok>=1_000_000||t.__sol>=0.5).sort((a,b)=>a.__time-b.__time);const byWallet={}
