<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1280,initial-scale=1"><style>html,body{margin:0;width:1280px;height:960px;overflow:hidden;background:#777}canvas{display:block;width:1280px;height:960px;image-rendering:pixelated}</style></head><body><canvas id="c" width="1280" height="960"></canvas><script>
const q=new URLSearchParams(location.search),MODE=q.get('mode')||'test',PART=Math.max(0,Number(q.get('part')||0)),CELL=4,W=1280,H=960,COLS=W/CELL,ROWS=H/CELL,CAL=64,LEVEL=[0,85,170,255];
const HELIUS_KEY='64d5184c-1e1a-41a7-aed2-04aa72576bfd',M555='CQwwRomsuWsUCPYomZmRnwMns4ZCTASc31ExMvSysAF2',USDC='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v',WSOL='So11111111111111111111111111111111111111112';
function get(url){const x=new XMLHttpRequest();x.open('GET',url,false);x.setRequestHeader('accept','application/json');x.send();if(x.status!==200)throw Error('GET '+url+' HTTP '+x.status+' '+x.responseText.slice(0,1000));return JSON.parse(x.responseText)}
function core(a,w){return (a||[]).map(t=>[t.signature,t.timestamp,t.type,t.source,t.fee,t.feePayer,t.error??null,(t.nativeTransfers||[]).filter(x=>x.fromUserAccount===w||x.toUserAccount===w).map(x=>[x.fromUserAccount,x.toUserAccount,x.amount]),(t.tokenTransfers||[]).filter(x=>x.fromUserAccount===w||x.toUserAccount===w||x.mint===M555||x.mint===USDC||x.mint===WSOL).map(x=>[x.fromUserAccount,x.toUserAccount,x.fromTokenAccount,x.toTokenAccount,x.mint,x.tokenAmount,x.tokenStandard]),q.get('desc')==='1'?(t.description||''):null])}
function payload(){if(MODE==='test'){const n=Number(q.get('n')||10000);return ['test',n,Array.from({length:n},(_,i)=>String.fromCharCode(32+(i*17)%95)).join('')]}
if(MODE==='helius'){const w=q.get('address');if(!w)throw Error('address required');const from=q.get('from')||'2025-01-01',to=q.get('to')||'2026-08-30',gte=Math.floor(new Date(from+'T00:00:00Z').getTime()/1000),lte=Math.floor(new Date(to+'T23:59:59Z').getTime()/1000);let u='https://api-mainnet.helius-rpc.com/v0/addresses/'+w+'/transactions?api-key='+HELIUS_KEY+'&limit='+(q.get('limit')||100)+'&token-accounts=balanceChanged&gte-time='+gte+'&lte-time='+lte+'&sort-order='+(q.get('sort')||'asc');if(q.get('type'))u+='&type='+encodeURIComponent(q.get('type'));if(q.get('source'))u+='&source='+encodeURIComponent(q.get('source'));if(q.get('before'))u+='&before-signature='+encodeURIComponent(q.get('before'));const raw=get(u);return ['helius-core',{wallet:w,from,to,type:q.get('type')||null,source:q.get('source')||null,returned:raw.length,schema:['signature','timestamp','type','source','fee','feePayer','error','native[from,to,lamports]','token[fromUser,toUser,fromToken,toToken,mint,amount,standard]','description?']},core(raw,w)]}
if(MODE==='heliusHistory'){const w=q.get('address');let u='https://api.helius.xyz/v1/wallet/'+w+'/history?api-key='+HELIUS_KEY+'&limit='+(q.get('limit')||100)+'&tokenAccounts=balanceChanged';if(q.get('before'))u+='&before='+encodeURIComponent(q.get('before'));const raw=get(u);return ['helius-history',{wallet:w,pagination:raw.pagination},raw.data]}
if(MODE==='streamflow'){let u=q.get('url');if(!u){const id=q.get('id'),mint=q.get('mint'),sender=q.get('sender'),recipient=q.get('recipient');u='https://api-public.streamflow.finance/v2/api/contracts/tabularium/'+(id||'');const p=new URLSearchParams();if(mint)p.set('mint',mint);if(sender)p.set('sender',sender);if(recipient)p.set('recipient',recipient);if([...p].length)u+=(u.includes('?')?'&':'?')+p.toString()}return ['streamflow',u,get(u)]}
if(MODE==='url'){const u=q.get('url');return ['url',u,get(u)]}throw Error('unknown mode '+MODE)}
function crc32(b){let c=0xffffffff;for(const x of b){c^=x;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}function u32(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255;a[o+2]=(v>>>16)&255;a[o+3]=(v>>>24)&255}
function draw(bytes){const cap=Math.floor((COLS*ROWS-CAL)/4)-32,parts=Math.max(1,Math.ceil(bytes.length/cap)),start=PART*cap,chunk=bytes.slice(start,Math.min(bytes.length,start+cap)),h=new Uint8Array(32);h.set(new TextEncoder().encode('R555BIN3'));u32(h,8,bytes.length);u32(h,12,PART);u32(h,16,parts);u32(h,20,chunk.length);u32(h,24,crc32(bytes));u32(h,28,crc32(chunk));const a=new Uint8Array(32+chunk.length);a.set(h);a.set(chunk,32);const g=document.getElementById('c').getContext('2d',{alpha:false});g.imageSmoothingEnabled=false;let ci=0;function cell(s){const x=ci%COLS*CELL,y=Math.floor(ci/COLS)*CELL,v=LEVEL[s];g.fillStyle='rgb('+v+','+v+','+v+')';g.fillRect(x,y,CELL,CELL);ci++}for(let i=0;i<CAL;i++)cell(i%4);for(const b of a){cell(b>>>6);cell((b>>>4)&3);cell((b>>>2)&3);cell(b&3)}while(ci<COLS*ROWS)cell(0);document.body.dataset.ready='1';document.title='R555 '+MODE+' '+PART+'/'+parts}
try{draw(new TextEncoder().encode(JSON.stringify(payload())))}catch(e){draw(new TextEncoder().encode(JSON.stringify(['error',String(e.stack||e)])));document.body.dataset.error='1'}
</script></body></html>
