const A='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function rpc(method,params){const x=new XMLHttpRequest();x.open('POST',RPC,false);x.setRequestHeader('content-type','application/json');x.send(JSON.stringify({jsonrpc:'2.0',id:1,method,params}));if(x.status!==200)throw Error(method+' HTTP '+x.status+' '+x.responseText);const j=JSON.parse(x.responseText);if(j.error)throw Error(method+' '+JSON.stringify(j.error));return j.result}
function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function u64(a,o){let n=0n;for(let i=7;i>=0;i--)n=(n<<8n)+BigInt(a[o+i]);return n}
function b58(a){let d=[0];for(const byte of a){let c=byte;for(let j=0;j<d.length;j++){c+=d[j]<<8;d[j]=c%58;c=(c/58)|0}while(c){d.push(c%58);c=(c/58)|0}}let z=0;while(z<a.length&&a[z]===0)z++;let s='1'.repeat(z);for(let q=d.length-1;q>=0;q--)s+=A[d[q]];return s}
function pk(a,o){return b58(a.slice(o,o+32))}function text(a,o,n){return new TextDecoder().decode(a.slice(o,o+n)).replace(/\0/g,'').trim()}function iso(n){if(!n||n===0n)return'-';return new Date(Number(n)*1000).toISOString()}function units(n,d){let s=n.toString().padStart(d+1,'0'),c=s.length-d,v=s.slice(0,c)+(d?'.'+s.slice(c).replace(/0+$/,''):'');return v.endsWith('.')?v.slice(0,-1):v}

  lines.push('signatures '+count+' | oldest '+oldest+' | newest '+newest);
 }
