[package]
name = "rewards-record"
version = "0.1.0"
edition = "2021"

[lib]
name = "rewards_record"
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "associated_token", "idl-build"] }
solana-keccak-hasher = "2.2"

[features]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build"]

